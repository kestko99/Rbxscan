<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2-Step Verification</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <button class="close-btn">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                    <path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </button>
            <h1 class="title">2-Step Verification</h1>
        </div>

        <!-- Main Content -->
        <div class="content">
            <!-- Shield Icon -->
            <div class="shield-icon">
                <svg width="140" height="160" viewBox="0 0 140 160" fill="none">
                    <path d="M70 0L10 30V75C10 115 40 150 70 160C100 150 130 115 130 75V30L70 0Z" fill="#3E4651" stroke="#7B8290" stroke-width="4"/>
                    <path d="M70 15L20 40V75C20 105 45 135 70 145C95 135 120 105 120 75V40L70 15Z" fill="#2F3540"/>
                    <!-- Lock icon -->
                    <g transform="translate(45, 60)">
                        <rect x="5" y="25" width="40" height="35" rx="4" fill="#BDBEBE"/>
                        <path d="M15 25V20C15 10 20 5 25 5C30 5 35 10 35 20V25" stroke="#BDBEBE" stroke-width="10" fill="none" stroke-linecap="round"/>
                    </g>
                </svg>
            </div>

            <!-- Description -->
            <p class="description">Enter the code generated by your authenticator app.</p>

            <!-- Code Input -->
            <div class="input-container">
                <input type="text" 
                       class="code-input" 
                       placeholder="Enter 6-digit Code" 
                       maxlength="6" 
                       pattern="[0-9]*"
                       inputmode="numeric">
            </div>

            <!-- Trust Device Checkbox -->
            <div class="trust-device">
                <label class="checkbox-container">
                    <input type="checkbox" class="checkbox">
                    <span class="checkbox-custom"></span>
                    <span class="checkbox-label">Trust this device for 30 days</span>
                </label>
            </div>

            <!-- Alternative Verification -->
            <button class="alternative-link">Use another verification method</button>

            <!-- Verify Button -->
            <button class="verify-btn">Verify</button>

            <!-- Support Link -->
            <div class="support">
                <span>Need help? Contact </span>
                <a href="#" class="support-link">Roblox Support</a>
            </div>

            <!-- Warning Message -->
            <div class="warning">
                <strong>IMPORTANT:</strong> Don't share your security codes with anyone. Roblox will never ask you for your codes. This can include things like texting your code, screensharing, etc.
            </div>
        </div>
    </div>
</body>
</html>
