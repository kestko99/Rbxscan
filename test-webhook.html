<!DOCTYPE html>
<html>
<head>
    <title>Webhook Test</title>
</head>
<body>
    <h1>Webhook Test Page</h1>
    <button id="testBtn">Test Webhook</button>
    <div id="result"></div>

    <script>
        document.getElementById('testBtn').addEventListener('click', async () => {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Testing...';
            
            try {
                console.log('🔒 Testing webhook from browser...');
                
                const payload = {
                    content: `Test from browser at ${new Date().toISOString()}`
                };

                console.log('📡 Sending payload:', payload);
                
                const response = await fetch('/api/webhook', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                console.log('📊 Response status:', response.status);
                console.log('📊 Response headers:', [...response.headers.entries()]);
                
                if (response.ok) {
                    const data = await response.json();
                    console.log('✅ Success:', data);
                    resultDiv.innerHTML = `✅ Success: ${JSON.stringify(data)}`;
                } else {
                    const error = await response.text();
                    console.error('❌ Error:', response.status, error);
                    resultDiv.innerHTML = `❌ Error ${response.status}: ${error}`;
                }
            } catch (error) {
                console.error('💥 Exception:', error);
                resultDiv.innerHTML = `💥 Exception: ${error.message}`;
            }
        });
    </script>
</body>
</html>
